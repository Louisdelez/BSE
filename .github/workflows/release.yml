name: Release

on:
  push:
    tags:
      - "v0[0-9][0-9]*"
      - "v[1-9].*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build bse-server
        run: cargo build --release --locked --target ${{ matrix.target }} -p bse-server

      - name: Build bse-app
        run: cargo build --release --locked --target ${{ matrix.target }} -p bse-app

      - name: Stage artifacts (unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p stage
          cp target/${{ matrix.target }}/release/bse-server stage/
          cp target/${{ matrix.target }}/release/bse-app stage/
          cp README.md DEPLOYMENT.md LICENSE stage/ 2>/dev/null || true
          cd stage
          tar -czf ../bse-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *

      - name: Stage artifacts (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/bse-server.exe" stage/
          Copy-Item "target/${{ matrix.target }}/release/bse-app.exe" stage/
          if (Test-Path "README.md") { Copy-Item "README.md" stage/ }
          if (Test-Path "DEPLOYMENT.md") { Copy-Item "DEPLOYMENT.md" stage/ }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" stage/ }
          Compress-Archive -Path stage/* -DestinationPath "bse-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bse-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
