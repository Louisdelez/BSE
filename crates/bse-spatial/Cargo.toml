[package]
name = "bse-spatial"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Spatial index (Quadtree) for BSE viewport culling and hit-testing."

[dependencies]
bse-types.workspace = true

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
