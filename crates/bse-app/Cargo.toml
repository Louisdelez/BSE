[package]
name = "bse-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "BSE desktop application binary."

[lib]
name = "bse_app"
path = "src/lib.rs"

[[bin]]
name = "bse"
path = "src/main.rs"

[dependencies]
bse-auth.workspace = true
bse-canvas.workspace = true
bse-crdt.workspace = true
bse-model.workspace = true
bse-pen.workspace = true
bse-projects.workspace = true
bse-protocol.workspace = true
bse-render.workspace = true
bse-spatial.workspace = true
bse-storage.workspace = true
bse-sync.workspace = true
bse-types.workspace = true
bse-ui.workspace = true
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
eframe = { version = "0.30", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui-notify = "0.18"
egui-phosphor = "0.8"
earcutr = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
directories = "5"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
