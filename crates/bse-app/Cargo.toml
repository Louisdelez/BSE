[package]
name = "bse-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "BSE desktop application binary."

[lib]
name = "bse_app"
path = "src/lib.rs"

[[bin]]
name = "bse"
path = "src/main.rs"

[dependencies]
bse-canvas.workspace = true
bse-crdt.workspace = true
bse-model.workspace = true
bse-render.workspace = true
bse-types.workspace = true
bse-ui.workspace = true
eframe = { version = "0.30", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
